  <main id="main"><section class="shell tool-page" data-notes-tool><header class="tool-header"><a class="breadcrumb" href="../">← 返回实验室</a><p class="eyebrow">实验 02 / 浏览器小工具</p><h1>灵感便签<span class="orange">.</span></h1><p>一个闪过的念头，一句还没想完的话。先留下来，再慢慢想。</p></header><div class="notes-privacy"><svg class="icon " viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 2 2.7 7.3L22 12l-7.3 2.7L12 22l-2.7-7.3L2 12l7.3-2.7Z"/></svg><p><strong>仅保存在当前浏览器。</strong>便签不会公开或自动同步。清理浏览器数据前，请先导出备份。</p></div><div class="notes-workspace"><form class="tool-panel note-compose" id="notes-form"><div class="panel-heading"><h2 data-note-form-title>写下一点想法</h2><span>捕捉 / 留存</span></div><label class="field">给它一个标题<input name="title" maxlength="80" placeholder="也可以先不取名字"></label><label class="field">此刻在想什么？<textarea name="body" rows="9" maxlength="6000" required placeholder="从一个念头开始…"></textarea></label><div class="result-actions"><button class="button button-blue" type="submit">保存这段灵感 <svg class="icon " viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button><button class="button button-quiet" type="button" data-cancel-edit hidden>取消编辑</button></div><p class="tool-status" data-notes-status role="status" aria-live="polite"></p></form><section class="notes-collection"><div class="notes-toolbar"><h2>收集到的灵感 <span data-notes-count>0</span></h2><div><button class="small-button" type="button" data-export-notes>导出备份 ↓</button><label class="small-button import-label">导入备份<input type="file" accept="application/json,.json" data-import-notes></label></div></div><div class="undo-bar" data-undo-bar hidden><span>已移除一条便签</span><button type="button" data-undo-note>撤销</button></div><div class="notes-list" data-notes-list></div><div class="notes-empty" data-notes-empty><svg class="icon " viewBox
