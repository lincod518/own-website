  <main id="main"><section class="shell tool-page"><header class="tool-header"><a class="breadcrumb" href="../">← 返回实验室</a><p class="eyebrow">实验 01 / 浏览器小工具</p><h1>提示词拼装台<span class="orange">.</span></h1><p>先把问题想清楚，再交给 AI。填写左边的任务卡，右边会实时整理成一段提示词。</p></header><div class="tool-workspace" data-prompt-tool><form class="tool-panel" id="prompt-form"><div class="panel-heading"><h2>你的任务卡</h2><span>01 / 输入</span></div><label class="field">从一个场景开始<select name="preset"><option value="blank">自由填写</option><option value="thinking">梳理一个想法</option><option value="learning">理解一个新概念</option><option value="project">规划一个小项目</option></select></label><label class="field">你希望 AI 扮演谁？<input name="role" maxlength="200" placeholder="例如：善于追问的思考伙伴"></label><label class="field">你想完成什么？<textarea name="goal" rows="3" maxlength="2000" placeholder="把你最想解决的那个问题写下来…"></textarea></label><label class="field">有哪些背景信息？<textarea name="context" rows="3" maxlength="4000" placeholder="已知信息、当前进展，或者你试过的方法…"></textarea></label><label class="field">有什么要求或限制？<textarea name="constraints" rows="2" maxlength="2000" placeholder="例如：先指出不确定性，不要编造事实"></textarea></label><label class="field">希望得到什么形式的回答？<input name="format" maxlength="500" placeholder="例如：三个关键问题，加一份行动清单"></label><button type="reset" class="button button-quiet">清空任务卡</button></form><section class="tool-panel prompt-result"><div class="panel-heading"><h2>整理好的提示词</h2><span>02 / 带走</span></div><p class="tool-explanation">组合后，复制到你常用的 AI 工具中继续使用。</p><pre id="prompt-output" tabindex="0"></pre><div class="result-actions"><button type="button" class="button button-blue" data-copy-prompt><svg class="icon " viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V4a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v11a1 1 0 0 0 1 1h4"/></svg>复制提示词</button><button type="button" class="button button-quiet" data-download-prompt>下载 .txt ↓</button></div><p class="tool-status" data-prompt-status role="status" aria-live="polite"></p><p class="privacy-note">这张任务卡只在当前页面处理，不上传内容，也不会调用模型。刷新页面会清空输入。</p></section></div></section></main>
